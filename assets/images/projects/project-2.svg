<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080e"/>
      <stop offset="60%" stop-color="#240b17"/>
      <stop offset="100%" stop-color="#0f050a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c52233"/>
      <stop offset="50%" stop-color="#e03b4c"/>
      <stop offset="100%" stop-color="#e5a86d"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e03b4c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c52233" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg2)"/>
  <circle cx="680" cy="120" r="150" fill="#e03b4c" opacity="0.14" filter="blur(60px)"/>
  <circle cx="150" cy="400" r="160" fill="#8b1528" opacity="0.16" filter="blur(60px)"/>
  
  <g transform="translate(60, 45)" filter="url(#shadow2)">
    <!-- Main Window -->
    <rect width="680" height="410" rx="16" fill="#180e14" stroke="#3d1d2b" stroke-width="1.5"/>
    <!-- Topbar -->
    <rect width="680" height="42" rx="16" fill="#20111a"/>
    <rect y="30" width="680" height="12" fill="#20111a"/>
    <circle cx="28" cy="21" r="5" fill="#e03b4c"/>
    <circle cx="46" cy="21" r="5" fill="#e5a86d"/>
    <circle cx="64" cy="21" r="5" fill="#48bb78"/>
    <text x="340" y="26" fill="#c58e9f" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">velvet-analytics.io/enterprise-pulse</text>

    <!-- Top KPI Cards -->
    <!-- KPI 1 -->
    <rect x="30" y="65" width="190" height="85" rx="10" fill="#21121b" stroke="#3d1d2b"/>
    <text x="50" y="90" fill="#a8929e" font-family="sans-serif" font-size="11">Total Revenue</text>
    <text x="50" y="122" fill="#f8f4f0" font-family="Georgia, serif" font-size="24" font-weight="bold">$842,500</text>
    <rect x="155" y="78" width="50" height="18" rx="9" fill="#2a1420"/>
    <text x="180" y="91" fill="#48bb78" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+24.8%</text>

    <!-- KPI 2 -->
    <rect x="245" y="65" width="190" height="85" rx="10" fill="#21121b" stroke="#3d1d2b"/>
    <text x="265" y="90" fill="#a8929e" font-family="sans-serif" font-size="11">Active Subscribers</text>
    <text x="265" y="122" fill="#f8f4f0" font-family="Georgia, serif" font-size="24" font-weight="bold">64,280</text>
    <rect x="370" y="78" width="50" height="18" rx="9" fill="#2a1420"/>
    <text x="395" y="91" fill="#e5a86d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+18.2%</text>

    <!-- KPI 3 -->
    <rect x="460" y="65" width="190" height="85" rx="10" fill="#21121b" stroke="#3d1d2b"/>
    <text x="480" y="90" fill="#a8929e" font-family="sans-serif" font-size="11">Conversion Rate</text>
    <text x="480" y="122" fill="#f8f4f0" font-family="Georgia, serif" font-size="24" font-weight="bold">4.92%</text>
    <rect x="585" y="78" width="50" height="18" rx="9" fill="#2a1420"/>
    <text x="610" y="91" fill="#e03b4c" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+3.4%</text>

    <!-- Main Chart Card -->
    <rect x="30" y="170" width="405" height="215" rx="10" fill="#21121b" stroke="#3d1d2b"/>
    <text x="50" y="200" fill="#f8f4f0" font-family="sans-serif" font-size="13" font-weight="600">Growth Velocity &amp; MRR Flow</text>
    <text x="50" y="216" fill="#a8929e" font-family="sans-serif" font-size="10">Real-time cohort projection</text>

    <!-- Chart gridlines -->
    <line x1="50" y1="240" x2="415" y2="240" stroke="#331826" stroke-dasharray="3 3"/>
    <line x1="50" y1="280" x2="415" y2="280" stroke="#331826" stroke-dasharray="3 3"/>
    <line x1="50" y1="320" x2="415" y2="320" stroke="#331826" stroke-dasharray="3 3"/>
    <line x1="50" y1="355" x2="415" y2="355" stroke="#3d1d2b"/>

    <!-- Chart Path -->
    <path d="M 50 340 Q 110 320, 160 270 T 260 250 T 340 190 T 415 175 L 415 355 L 50 355 Z" fill="url(#areaGrad)"/>
    <path d="M 50 340 Q 110 320, 160 270 T 260 250 T 340 190 T 415 175" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Data points -->
    <circle cx="160" cy="270" r="5" fill="#e03b4c" stroke="#f8f4f0" stroke-width="2"/>
    <circle cx="340" cy="190" r="5" fill="#e5a86d" stroke="#f8f4f0" stroke-width="2"/>
    <circle cx="415" cy="175" r="5" fill="#f8f4f0" stroke="#e03b4c" stroke-width="2"/>

    <!-- Right Side Donut / Stream Card -->
    <rect x="460" y="170" width="190" height="215" rx="10" fill="#21121b" stroke="#3d1d2b"/>
    <text x="480" y="200" fill="#f8f4f0" font-family="sans-serif" font-size="13" font-weight="600">Channel Split</text>
    
    <!-- Segment rings -->
    <circle cx="555" cy="265" r="48" fill="none" stroke="#2d1623" stroke-width="14"/>
    <circle cx="555" cy="265" r="48" fill="none" stroke="#c52233" stroke-width="14" stroke-dasharray="160 300" stroke-dashoffset="40"/>
    <circle cx="555" cy="265" r="48" fill="none" stroke="#e5a86d" stroke-width="14" stroke-dasharray="80 300" stroke-dashoffset="200"/>
    <text x="555" y="270" fill="#f8f4f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">68%</text>

    <!-- Legend -->
    <circle cx="485" cy="340" r="4" fill="#c52233"/>
    <text x="495" y="344" fill="#a8929e" font-family="sans-serif" font-size="10">Direct Enterprise</text>
    
    <circle cx="485" cy="360" r="4" fill="#e5a86d"/>
    <text x="495" y="364" fill="#a8929e" font-family="sans-serif" font-size="10">Partner Inbound</text>
  </g>
</svg>
