<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgThesis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160a11"/>
      <stop offset="50%" stop-color="#260e1b"/>
      <stop offset="100%" stop-color="#10060c"/>
    </linearGradient>
    <linearGradient id="accentCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e03b4c"/>
      <stop offset="100%" stop-color="#8b1528"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3c99f"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="shadowThesis" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgThesis)"/>
  <circle cx="180" cy="140" r="160" fill="#c52233" opacity="0.15" filter="blur(65px)"/>
  <circle cx="650" cy="380" r="150" fill="#e5a86d" opacity="0.12" filter="blur(65px)"/>

  <!-- Main Window: SmartPLS 4 SEM Path Model & Research Interface -->
  <g transform="translate(60, 45)" filter="url(#shadowThesis)">
    <rect width="680" height="410" rx="16" fill="#190e16" stroke="#3d1d2b" stroke-width="1.5"/>
    <!-- Topbar -->
    <rect width="680" height="42" rx="16" fill="#22121e"/>
    <rect y="30" width="680" height="12" fill="#22121e"/>
    <circle cx="28" cy="21" r="5" fill="#e03b4c"/>
    <circle cx="46" cy="21" r="5" fill="#e5a86d"/>
    <circle cx="64" cy="21" r="5" fill="#48bb78"/>
    <text x="340" y="26" fill="#c58e9f" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">SmartPLS 4 • PLS-SEM Model — Telecom Digital Transformation (Mogadishu)</text>

    <!-- Thesis Header Ribbon -->
    <rect x="25" y="60" width="630" height="60" rx="10" fill="#22101c" stroke="#3d1d2b"/>
    <text x="45" y="85" fill="#f8f4f0" font-family="Georgia, serif" font-size="14" font-weight="bold">Undergraduate Thesis: Digital Transformation in Mogadishu’s Telecom Sector</text>
    <text x="45" y="105" fill="#f3c99f" font-family="sans-serif" font-size="11">SIMAD University • Quantitative Study • Structural Equation Modeling (PLS-SEM) &amp; SPSS</text>
    <rect x="535" y="75" width="105" height="28" rx="6" fill="url(#accentCrimson)"/>
    <text x="587" y="93" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PLS-SEM Model</text>

    <!-- Structural Equation Path Model Canvas -->
    <rect x="25" y="135" width="430" height="250" rx="10" fill="#130910" stroke="#381827"/>
    <text x="40" y="158" fill="#a8929e" font-family="sans-serif" font-size="11" font-weight="600">Structural Equation Path Diagram (SmartPLS 4)</text>

    <!-- Latent Construct 1: Digital Infrastructure -->
    <rect x="50" y="180" width="105" height="50" rx="8" fill="#271120" stroke="#c52233" stroke-width="1.5"/>
    <text x="102" y="202" fill="#f8f4f0" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Digital Infra</text>
    <text x="102" y="218" fill="#e5a86d" font-family="sans-serif" font-size="8.5" text-anchor="middle">AVE: 0.684</text>

    <!-- Latent Construct 2: Org Readiness -->
    <rect x="50" y="260" width="105" height="50" rx="8" fill="#271120" stroke="#c52233" stroke-width="1.5"/>
    <text x="102" y="282" fill="#f8f4f0" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Org Readiness</text>
    <text x="102" y="298" fill="#e5a86d" font-family="sans-serif" font-size="8.5" text-anchor="middle">AVE: 0.712</text>

    <!-- Endogenous Construct: Operational Performance -->
    <rect x="310" y="220" width="125" height="60" rx="8" fill="#2f1426" stroke="#f3c99f" stroke-width="1.5"/>
    <text x="372" y="246" fill="#f8f4f0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Firm Performance</text>
    <text x="372" y="264" fill="#e5a86d" font-family="sans-serif" font-size="9" text-anchor="middle">R² = 0.648</text>

    <!-- Path Lines with Beta Coefficients -->
    <!-- Path 1 -->
    <path d="M 155 205 L 310 240" stroke="#e03b4c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="205" y="205" width="55" height="18" rx="4" fill="#1b0c15" stroke="#481c2f"/>
    <text x="232" y="218" fill="#f8f4f0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">β = 0.428*</text>

    <!-- Path 2 -->
    <path d="M 155 285 L 310 260" stroke="#e03b4c" stroke-width="2"/>
    <rect x="205" y="270" width="55" height="18" rx="4" fill="#1b0c15" stroke="#481c2f"/>
    <text x="232" y="283" fill="#f8f4f0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">β = 0.382*</text>

    <!-- Model Stats Footer in Canvas -->
    <text x="40" y="365" fill="#8d7483" font-family="sans-serif" font-size="9.5">SRMR: 0.052 • NFI: 0.914 • Composite Reliability &gt; 0.85 • p &lt; 0.01</text>

    <!-- Right Column: SPSS Summary & Empirical Findings -->
    <rect x="470" y="135" width="185" height="250" rx="10" fill="#21101b" stroke="#3d1d2b"/>
    <text x="485" y="160" fill="#f8f4f0" font-family="sans-serif" font-size="12" font-weight="600">Statistical Analysis</text>
    <text x="485" y="176" fill="#f3c99f" font-family="sans-serif" font-size="10">SPSS &amp; Descriptive Metrics</text>

    <!-- Metric Card 1 -->
    <rect x="485" y="195" width="155" height="48" rx="6" fill="#180a13" stroke="#3d1d2b"/>
    <text x="495" y="213" fill="#a8929e" font-family="sans-serif" font-size="9">Target Sector</text>
    <text x="495" y="231" fill="#f8f4f0" font-family="sans-serif" font-size="11" font-weight="bold">Mogadishu Telecoms</text>

    <!-- Metric Card 2 -->
    <rect x="485" y="252" width="155" height="48" rx="6" fill="#180a13" stroke="#3d1d2b"/>
    <text x="495" y="270" fill="#a8929e" font-family="sans-serif" font-size="9">Methodology</text>
    <text x="495" y="288" fill="#e5a86d" font-family="sans-serif" font-size="11" font-weight="bold">Quantitative Survey</text>

    <!-- Metric Card 3 -->
    <rect x="485" y="309" width="155" height="60" rx="6" fill="#180a13" stroke="#3d1d2b"/>
    <text x="495" y="327" fill="#a8929e" font-family="sans-serif" font-size="9">Analytical Toolset</text>
    <text x="495" y="343" fill="#e03b4c" font-family="sans-serif" font-size="10" font-weight="bold">SmartPLS 4 (PLS-SEM)</text>
    <text x="495" y="358" fill="#f3c99f" font-family="sans-serif" font-size="10">IBM SPSS Statistics</text>
  </g>
</svg>
